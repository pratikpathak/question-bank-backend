<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Questions</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        .container { max-width: 500px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #responseMessage { margin-top: 15px; padding: 10px; border-radius: 4px; display: none; font-weight: bold; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Create Question Bank</h2>
    <p><a href="/getSubjects.html">Take a quiz</a></p>
    <button id="logoutButton" type="button">Sign out</button>
    <form id="questionForm">
        <div class="form-group">
            <label for="subject">Select Subject:</label>
            <select id="subject" required>
                <option value="">-- Choose a Subject --</option>
                <option value="KOTLIN">KOTLIN</option>
                <option value="JAVA">JAVA</option>
                <option value="AI">AI</option>
                <option value="REACT">REACT</option>
                <option value="PYTHON">PYTHON</option>
                <option value="SPRING_BOOT">SPRING BOOT</option>
            </select>
        </div>

        <div class="form-group">
            <label for="question">Question:</label>
            <textarea id="question" rows="3" required placeholder="Enter question text here..."></textarea>
        </div>

        <div class="form-group"><label for="option1">Option A:</label><input type="text" id="option1" required></div>
        <div class="form-group"><label for="option2">Option B:</label><input type="text" id="option2" required></div>
        <div class="form-group"><label for="option3">Option C:</label><input type="text" id="option3" required></div>
        <div class="form-group"><label for="option4">Option D:</label><input type="text" id="option4" required></div>

        <div class="form-group">
            <label for="correctOption">Correct option:</label>
            <select id="correctOption" required>
                <option value="">-- Select the correct option --</option>
                <option value="A">A</option>
                <option value="B">B</option>
                <option value="C">C</option>
                <option value="D">D</option>
            </select>
        </div>
        <div class="form-group">
            <label for="solution">Solution/Correct Answer Summary:</label>
            <textarea id="solution" rows="2" required placeholder="Explain the correct answer..."></textarea>
        </div>

        <button type="submit">Submit Question</button>
    </form>

    <div id="responseMessage"></div>
</div>

<script>
    async function requireStaff() {
        const response = await fetch('/api/auth/me');
        const user = await response.json();
        if (!user.authenticated) {
            window.location.replace('/');
            return false;
        }
        if (user.role !== 'ADMIN' && user.role !== 'DATA_ENTRY' && user.role !== 'OPERATOR') {
            window.location.replace('/getSubjects.html');
            return false;
        }
        return true;
    }

    document.getElementById('logoutButton').addEventListener('click', async function () {
        await fetch('/api/auth/logout', { method: 'POST' });
        window.location.replace('/');
    });

    document.getElementById('questionForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const responseDiv = document.getElementById('responseMessage');
        responseDiv.style.display = 'none';

        // Prepare the payload mapping exactly to the backend keys
        const payload = {
            subject: document.getElementById('subject').value,
            question: document.getElementById('question').value,
            option1: document.getElementById('option1').value,
            option2: document.getElementById('option2').value,
            option3: document.getElementById('option3').value,
            option4: document.getElementById('option4').value,
            solution: document.getElementById('solution').value,
            correctOption: document.getElementById('correctOption').value
        };

        try {
            const response = await fetch('/api/questions/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            responseDiv.innerText = data.message || 'Request completed.';
            responseDiv.style.display = 'block';

            if (response.ok) {
                responseDiv.className = 'success';
                document.getElementById('questionForm').reset(); // Clear form on success
            } else {
                responseDiv.className = 'error';
            }
        } catch (error) {
            responseDiv.innerText = "Error: Could not connect to the microservice.";
            responseDiv.className = 'error';
            responseDiv.style.display = 'block';
        }
    });

    requireStaff().catch(function () {
        window.location.replace('/');
    });
</script>

</body>
</html>
